name: Build APK Release
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix QName bug
        run: |
          FLUTTER_FILE=$(find $RUNNER_TOOL_CACHE -name flutter.groovy | head -1)
          echo "Patching $FLUTTER_FILE"
          sed -i 's/import groovy.xml.QName//' $FLUTTER_FILE
          sed -i 's/import groovy.util.QName//' $FLUTTER_FILE
          head -15 $FLUTTER_FILE
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
